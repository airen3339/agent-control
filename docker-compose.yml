name: agent-control

services:
  relay:
    build:
      context: ./relay
    restart: unless-stopped
    environment:
      PORT: "8080"
      RELAY_PUBLIC_URL: "${RELAY_PUBLIC_URL:?Set RELAY_PUBLIC_URL in .env}"
      RELAY_KEY: "${RELAY_KEY:?Set RELAY_KEY in .env}"
      RELAY_DATA_PATH: /data/relay-state.json
    volumes:
      - relay-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["cloudflare"]
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}"
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "--metrics", "0.0.0.0:2000", "run"]

volumes:
  relay-data:
