apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-control-relay-data
  labels:
    app: agent-control-relay
    app.kubernetes.io/name: agent-control-relay
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-control-relay
  labels:
    app: agent-control-relay
    app.kubernetes.io/name: agent-control-relay
spec:
  type: ClusterIP
  selector:
    app: agent-control-relay
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-control-relay
  labels:
    app: agent-control-relay
    app.kubernetes.io/name: agent-control-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agent-control-relay
  template:
    metadata:
      labels:
        app: agent-control-relay
        app.kubernetes.io/name: agent-control-relay
    spec:
      initContainers:
        - name: install
          image: node:22-alpine
          command:
            - sh
            - -c
            - cp /source/relay-server.mjs /source/package.json /source/package-lock.json /app/ && mkdir -p /app/node_modules && tar -xzf /source/ws.tgz -C /app/node_modules
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: source
              mountPath: /source
              readOnly: true
            - name: app
              mountPath: /app
      containers:
        - name: relay
          image: node:22-alpine
          command: ["node", "/app/relay-server.mjs"]
          env:
            - name: PORT
              value: "8080"
            - name: RELAY_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: agent-control-relay-config
                  key: public-url
            - name: RELAY_DATA_PATH
              value: /data/state.json
            - name: RELAY_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-control-relay-secret
                  key: relay-key
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: app
              mountPath: /app
            - name: data
              mountPath: /data
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: source
          configMap:
            name: agent-control-relay-source-current
        - name: app
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: agent-control-relay-data
